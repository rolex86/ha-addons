name: "UniFi SSH Presence (MQTT)"
slug: "unifi_ssh_presence"
description: "Presence bez UniFi Controlleru: SSH polling UniFi AP a MQTT autodiscovery device_tracker"
version: "0.4.3"
url: "https://github.com/rolex86/ha-addons/tree/master/presence-ssh-mqtt"
arch:
  - aarch64
  - amd64
image: ghcr.io/rolex86/presence-ssh-mqtt

init: false
startup: services
boot: auto
homeassistant_api: false
hassio_api: false
host_network: false
ingress: false

options:
  mqtt:
    host: "core-mosquitto"
    port: 1883
    username: ""
    password: ""
    discovery_prefix: "homeassistant"
    base_topic: "unifi_presence"
    client_id: "unifi_ssh_presence"
  poll_interval_sec: 90
  away_after_misses: 3
  extended_mode: false
  confidence:
    enabled: true
    rssi_thresholds: [22, 26, 30, 34]
    rssi_scores: [10, 25, 40, 55, 65]
    idle_thresholds: [10, 120]
    idle_scores: [15, 8, 0]
    rate_thresholds: [20, 60, 90]
    rate_scores: [5, 10, 15, 20]
    band5_bonus: 3
    ssid_penalty_patterns: ["cam", "iot", "guest"]
    ssid_penalty: 10
    clamp_min: 0
    clamp_max: 100
  ssh:
    username: "unifiap"
    password: ""
    port: 22
    connect_timeout_sec: 8
    cmd_timeout_sec: 12
    known_hosts_strict: false
  aps: []
  floor_overrides: []
  learn_mode: true
  learn_max_entries: 50
  devices: []

schema:
  mqtt:
    host: str
    port: int
    username: str?
    password: password?
    discovery_prefix: str
    base_topic: str
    client_id: str
  poll_interval_sec: int
  away_after_misses: int
  extended_mode: bool
  confidence:
    enabled: bool
    rssi_thresholds:
      - int
    rssi_scores:
      - int
    idle_thresholds:
      - int
    idle_scores:
      - int
    rate_thresholds:
      - int
    rate_scores:
      - int
    band5_bonus: int(0,20)
    ssid_penalty_patterns:
      - str
    ssid_penalty: int(0,30)
    clamp_min: int(0,100)
    clamp_max: int(0,100)
  ssh:
    username: str
    password: password
    port: int
    connect_timeout_sec: int
    cmd_timeout_sec: int
    known_hosts_strict: bool
  aps:
    - name: str
      host: str
      floor: str?
  floor_overrides:
    - ap_name: str
      floor: str
  learn_mode: bool
  learn_max_entries: int
  devices:
    - mac: str
      name: str
      allow_randomized: bool?

ports: {}
log_level: info
